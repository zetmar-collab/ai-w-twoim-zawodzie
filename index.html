<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI w Twoim Zawodzie – Cyfrowy Przyjaciel</title>
    <meta name="description" content="Darmowy generator AI Stack dla Twojego zawodu. Wpisz zawod i poziom, dostaniesz 8-10 narzedzi AI z gotowymi promptami." />
  </head>
  <body>
    <script>
      (function () {
        var stored = localStorage.getItem('app_theme')
        var dark =
          stored === 'dark' ||
          (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.setAttribute('data-theme', 'dark')
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
